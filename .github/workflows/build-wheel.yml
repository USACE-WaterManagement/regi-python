name: Build Python Wheel

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out
        required: false
        type: string
        default: ""
      upload-coverage-artifact:
        description: Whether to upload the Cobertura coverage.xml as an artifact for a downstream code-coverage upload job
        required: false
        type: boolean
        default: true

jobs:
  build-wheel:
    name: Build Python wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean build buildPythonWheel

      - name: Publish Python coverage summary
        if: always()
        run: |
          python3 .github/scripts/python_coverage_summary.py \
            regi-headless/build/reports/coverage/coverage.xml \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-html
          path: regi-headless/build/reports/coverage/html
          if-no-files-found: warn
          retention-days: 14

      # Cobertura XML for the actions/upload-code-coverage step in the calling workflow.
      # Skipped for fork PRs, which can't be granted `code-quality: write` anyway.
      - name: Upload coverage.xml artifact
        if: |
          always() && inputs.upload-coverage-artifact &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-cobertura
          path: regi-headless/build/reports/coverage/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Collect wheel
        run: |
          mkdir -p dist
          find . -path "*/build/install/*/dist/*.whl" -exec cp {} dist/ \;

      - name: Upload Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

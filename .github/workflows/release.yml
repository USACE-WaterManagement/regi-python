name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-wheel:
    name: Build wheel from release tag
    uses: ./.github/workflows/build-wheel.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  publish-wheel:
    name: Publish Python wheel to GitHub Release
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
      - name: Download Python wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS.txt

      - name: Publish wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.whl
            dist/SHA256SUMS.txt
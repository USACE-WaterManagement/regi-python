[pytest]
# pytest's built-in faulthandler plugin installs its own SEH-style handler
# for access violations. On Windows, HotSpot deliberately triggers access
# violations for implicit null checks (a normal JIT optimization) and
# recovers from them itself -- but faulthandler intercepts those first and
# prints a scary "Windows fatal exception: access violation" report for
# each one, even though the JVM keeps running fine afterward. Disabled here
# so real regi_python/JVM output isn't buried under spurious crash reports.
addopts = -p no:faulthandler
markers =
    integration: docker-based CDA integration tests (require Docker, real
        CDA_DATA_API_IMAGE/CDA_ETL_IMAGE images, and vendored CDA assets --
        see README.md)
